name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  onchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Solana
        run: |
          sh -c "$(curl -sSfL https://release.solana.com/v2.3.0/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Install Anchor
        run: cargo install --locked --version 0.32.1 anchor-cli --root "$HOME/.cargo"
      - name: Build program
        run: anchor build
      - name: Anchor e2e tests
        run: anchor test --skip-build

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - name: App typecheck
        run: npm run app:typecheck
